name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "mini project/server"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "mini project/server/package-lock.json"
      - run: npm ci
      - run: npm test
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "mini project/client"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "mini project/client/package-lock.json"
      - run: npm ci
      - run: npm run build
